# Pragmatic Play en betsson.es (comprobado el 15/10, ver docs/betsson-es-flujo.md).
# Lo que depende de cada juego (etiquetas, aspecto de los botones, zona de rodillos) NO está aquí:
# lo aprende la IA y se guarda en profiles/pragmaticplay/<juego>/.
id: pragmaticplay
filter_label: Pragmatic Play
# Juego por defecto. Cualquier otro: --game <slug>.
game_slug: sweet-bonanza-2500
game_load_timeout_s: 120
# Salvaguarda de dinero real: si tras bajar la apuesta se lee más que esto, no se gira.
max_bet: 0.50
# Testigo de red disponible para este proveedor (observación pasiva del tráfico del juego).
network_witness: pragmatic
# Eventos que el juego envía al casino por postMessage (ronda, apuesta, premio, saldo, idioma).
events_witness: pragmatic
