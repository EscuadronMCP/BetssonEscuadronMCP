# betsson.es — único mercado del reto (español, EUR).
# Solo nombres de variables de entorno: los valores van en .env o en GitHub Secrets.
id: es
base_url: https://www.betsson.es
language: es
currency: EUR
accounts:
  funded:
    email_env: BETSSON_ES_FUNDED_EMAIL
    password_env: BETSSON_ES_FUNDED_PASSWORD
  no_balance:
    email_env: BETSSON_ES_NO_BALANCE_EMAIL
    password_env: BETSSON_ES_NO_BALANCE_PASSWORD
ui:
