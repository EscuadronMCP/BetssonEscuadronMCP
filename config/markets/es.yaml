# betsson.es — único mercado del reto (español, EUR).
# Solo nombres de variables de entorno: los valores van en .env o en GitHub Secrets.
id: es
base_url: https://www.betsson.es
language: es
currency: EUR
locale: es-ES
timezone: Europe/Madrid
accounts:
  funded:
    email_env: BETSSON_ES_FUNDED_EMAIL
    password_env: BETSSON_ES_FUNDED_PASSWORD
  no_balance:
    email_env: BETSSON_ES_NO_BALANCE_EMAIL
    password_env: BETSSON_ES_NO_BALANCE_PASSWORD
ui:
  # Textos de la interfaz de betsson.es (comprobados el 15/10, ver docs/betsson-es-flujo.md).
  login_button: Iniciar sesión
  # Saldo en la cabecera, p. ej. "193,59 €".
  balance_pattern: "^\\s*\\d[\\d.\\s]*,\\d{2}\\s*€\\s*$"
  passkey_dismiss: Cancelar
  filters_button: Filtros
  results_button: Resultados
  clear_filters_button: Limpiar
  session_warning_text: finalizaste tu sesión
  session_limits_text: Tiempo de juego
  session_duration: 5 Horas
  session_loss_limit: 100%
  # Si el botón del porcentaje está desactivado (saldo 0 €), se escribe este límite en el campo.
  session_loss_input_placeholder: Introduce el límite de pérdidas
  session_loss_limit_fallback: "1"
  # Mensaje de saldo insuficiente en el idioma del mercado (cualquier proveedor).
  insufficient_funds_pattern: "(?i)fondos\\s+insuficientes|saldo\\s+insuficiente|no\\s+(tienes|dispones\\s+de)\\s+(suficiente\\s+)?saldo"
  # Otros avisos del juego que explican un fallo (se citan en el motivo del informe).
  game_notice_pattern: "(?i)sesi[oó]n\\s+(expirada|caducada|finalizada|cerrada)|error\\s+de\\s+conexi[oó]n|conexi[oó]n\\s+perdida|se\\s+ha\\s+producido\\s+un\\s+error"
  # Botones con los que el jugador cierra un mensaje del juego.
  dismiss_labels: [ACEPTAR, OK, CERRAR]
  # Etiquetas habituales del premio en el HUD (el premio solo se ve cuando hay ganancia).
  win_label_candidates: [GANANCIA, GANANCIAS, PREMIO, GANA, GANADO]
