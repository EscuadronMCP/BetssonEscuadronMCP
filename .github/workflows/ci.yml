name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Formato
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Tipos
        run: uv run mypy src tests
      - name: Tests unitarios
        run: uv run pytest -m "not e2e"
