name: Validación de juegos

# Ejecuta ambos escenarios una vez por mercado contra la web real y publica el informe.
# Juega con dinero real (apuesta mínima), así que solo se lanza a mano o por calendario.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Escenario a ejecutar
        type: choice
        default: all
        options: [all, completed_spin, insufficient_balance]
      inject_fault:
        description: "Demostración: provocar a propósito un fallo de saldo en este escenario"
        type: choice
        default: none
        options: [none, completed_spin, insufficient_balance]

permissions:
  contents: read

# Nunca dos ejecuciones a la vez con las mismas cuentas.
concurrency:
  group: validate-games
  cancel-in-progress: false

jobs:
  validate:
    name: ${{ matrix.market }}
    # betsson.es solo responde desde España: se ejecuta en un runner propio con IP española.
    # Variable del repositorio VALIDATION_RUNS_ON, p. ej. ["self-hosted","betsson-es"].
    runs-on: ${{ fromJSON(vars.VALIDATION_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        market: [es]
    env:
      BETSSON_ES_FUNDED_EMAIL: ${{ secrets.BETSSON_ES_FUNDED_EMAIL }}
      BETSSON_ES_FUNDED_PASSWORD: ${{ secrets.BETSSON_ES_FUNDED_PASSWORD }}
      BETSSON_ES_NO_BALANCE_EMAIL: ${{ secrets.BETSSON_ES_NO_BALANCE_EMAIL }}
      BETSSON_ES_NO_BALANCE_PASSWORD: ${{ secrets.BETSSON_ES_NO_BALANCE_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # Google Chrome ya viene en el runner; Playwright necesita su ffmpeg para grabar vídeo.
      - name: Preparar navegador
        run: uv run playwright install ffmpeg
      - name: Ejecutar escenarios
        env:
          SCENARIO: ${{ inputs.scenario || 'all' }}
          FAULT: ${{ inputs.inject_fault != 'none' && inputs.inject_fault || '' }}
        run: >
          uv run python -m betsson_validator run
          --market "${{ matrix.market }}"
          --scenario "$SCENARIO"
          ${FAULT:+--inject-fault "$FAULT"}
          --out "reports/${{ matrix.market }}"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Publicar informe y evidencias
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informe-${{ matrix.market }}
          path: reports/${{ matrix.market }}
          retention-days: 30
          if-no-files-found: error
